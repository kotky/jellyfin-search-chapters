<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Search Chapters</title>
</head>
<body>
    <div id="SearchChaptersConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="SearchChaptersConfigForm">
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="EnableFuzzySearch" name="EnableFuzzySearch" type="checkbox" is="emby-checkbox" />
                            <span>Enable fuzzy search</span>
                        </label>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var SearchChaptersConfig = {
                pluginUniqueId: '2d7f6b33-0e5f-4fba-a6b0-3de94a541234'
            };

            document.querySelector('#SearchChaptersConfigPage')
                .addEventListener('pageshow', function() {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(SearchChaptersConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#EnableFuzzySearch').checked = config.EnableFuzzySearch === undefined ? true : config.EnableFuzzySearch;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#SearchChaptersConfigForm')
                .addEventListener('submit', function(e) {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(SearchChaptersConfig.pluginUniqueId).then(function (config) {
                    config.EnableFuzzySearch = document.querySelector('#EnableFuzzySearch').checked;
                    ApiClient.updatePluginConfiguration(SearchChaptersConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });

                e.preventDefault();
                return false;
            });
        </script>
    </div>
</body>
</html>
